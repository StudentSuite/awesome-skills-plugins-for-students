name: Lint

on:
  pull_request:
    paths:
      - README.md
      - data/last-verified.json
      - data/skills.json
      - data/plugins.json
      - data/schema/entry.schema.json
      - scripts/check-list-format.mjs
      - scripts/check-counts*.mjs
      - scripts/check-markers*.mjs
      - scripts/check-last-verified*.mjs
      - scripts/validate-data*.mjs
      - scripts/generate-readme.mjs
      - scripts/audit-duplicate-urls.mjs
      - .github/workflows/lint.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - data/last-verified.json
      - data/skills.json
      - data/plugins.json
      - data/schema/entry.schema.json
      - scripts/check-list-format.mjs
      - scripts/check-counts*.mjs
      - scripts/check-markers*.mjs
      - scripts/check-last-verified*.mjs
      - scripts/validate-data*.mjs
      - scripts/generate-readme.mjs
      - scripts/audit-duplicate-urls.mjs
      - .github/workflows/lint.yml

jobs:
  check-list-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check-list-format.mjs
      - run: node scripts/check-last-verified.mjs
      - run: node scripts/validate-data.mjs
      # Fails if README.md has drifted from data/skills.json + data/plugins.json --
      # contributors edit the data files and run `node scripts/generate-readme.mjs`
      # locally to update README.md (see CONTRIBUTING.md).
      - run: node scripts/generate-readme.mjs --check
      # Informational only: reports cross-section URL reuse, never fails the job.
      - run: node scripts/audit-duplicate-urls.mjs
