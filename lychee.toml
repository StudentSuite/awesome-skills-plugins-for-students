# Config for the dead-link-check workflow (.github/workflows/dead-link-check.yml).
# Some legitimate, working hosts linked here (github.com, officialskills.sh, and a
# few docs sites) rate-limit or reject automated / non-browser requests with a 403
# or 429 even though they resolve fine in a real browser. Accepting those statuses
# avoids constant false-positive noise; a truly dead entry usually surfaces as a
# timeout, DNS failure, TLS error, or 404/410 instead, all of which still fail.
accept = [200, 202, 206, 403, 429]

max_concurrency = 8
timeout = 20
retry_wait_time = 2
max_retries = 2

user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
