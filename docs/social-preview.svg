<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Awesome Skills &amp; Plugins for Students — 89 skills, 18 plugins, for Claude Code, Cursor, Copilot, and Gemini CLI">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#818CF8" stroke-opacity="0.05" stroke-width="1"></path>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#1A1A2E"></rect>
  <rect width="1280" height="640" fill="url(#grid)"></rect>

  <!-- logo mark, scaled up from logo-lockup-dark.svg -->
  <g transform="translate(602,54) scale(1.0)">
    <path d="M 48 106 L 23 69 A 30 30 0 1 1 73 69 Z" fill="#818CF8"></path>
    <rect x="11" y="12" width="74" height="13" rx="3.5" fill="#818CF8"></rect>
    <circle cx="48" cy="12" r="4.5" fill="#818CF8"></circle>
    <path d="M 58 34 C 58 26 33 26 33 37 C 33 48 63 48 63 57 C 63 68 36 68 36 59" stroke="#1A1A2E" stroke-width="5.5" stroke-linecap="round" fill="none"></path>
    <path d="M 48 7.5 Q 67 5 75 20" stroke="#14B8A6" stroke-width="2.5" stroke-linecap="round" fill="none"></path>
    <circle cx="75" cy="23" r="3.5" fill="#14B8A6"></circle>
  </g>

  <!-- title -->
  <text font-family="'Space Grotesk', ui-sans-serif, sans-serif" font-weight="700" font-size="56" letter-spacing="-1.5" text-anchor="middle" x="640" y="248" fill="#FFFFFF">Awesome Skills &amp; Plugins</text>
  <text font-family="'Space Grotesk', ui-sans-serif, sans-serif" font-weight="700" font-size="56" letter-spacing="-1.5" text-anchor="middle" x="640" y="312" fill="#14B8A6">for Students</text>

  <line x1="500" y1="344" x2="780" y2="344" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"></line>

  <!-- counts -->
  <text font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" font-size="26" text-anchor="middle" x="640" y="398" fill="#E5E7EB">89 skills  /  18 plugins</text>

  <!-- tool chips -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="500">
    <g transform="translate(280,450)">
      <rect width="176" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFA366" stroke-opacity="0.5"></rect>
      <circle cx="28" cy="23" r="6" fill="#FFA366"></circle>
      <text x="46" y="29" fill="#F3F4F6">Claude Code</text>
    </g>
    <g transform="translate(478,450)">
      <rect width="132" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.04" stroke="#1E90FF" stroke-opacity="0.5"></rect>
      <circle cx="28" cy="23" r="6" fill="#1E90FF"></circle>
      <text x="46" y="29" fill="#F3F4F6">Cursor</text>
    </g>
    <g transform="translate(632,450)">
      <rect width="140" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.04" stroke="#2EA043" stroke-opacity="0.5"></rect>
      <circle cx="28" cy="23" r="6" fill="#2EA043"></circle>
      <text x="46" y="29" fill="#F3F4F6">Copilot</text>
